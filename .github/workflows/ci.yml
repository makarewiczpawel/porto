name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # conftest dokleja do tego nazwę bazy testowej i tworzy ją od zera.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m pytest tests/ -q

      - name: Migracje dają ten sam schemat co modele
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          # Pusty autogenerate znaczy, że migracje nadążają za modelami.
          alembic check

      - name: Baza startowa ładuje się i jest idempotentna
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          python -m app.seed.seed > /dev/null
          python - <<'PY'
          import json, subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "app.seed.seed"], capture_output=True, text=True, check=True
          ).stdout
          report = json.loads(out)
          assert report["new_items"] == 0, f"drugie uruchomienie dodało pozycje: {report}"
          print(f"OK — {report['items_total']} pozycji, bez duplikatów")
          PY

  frontend:
    name: Frontend — typy i build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Sprawdzenie typów
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_URL: https://api-porto.pmakarewicz.com
        run: npm run build
